name: Neovim config tests

on:
  push:
    paths:
      - "dotfiles/nvim/**"
      - ".github/workflows/nvim-tests.yml"
  pull_request:
    paths:
      - "dotfiles/nvim/**"
      - ".github/workflows/nvim-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: dotfiles/nvim/.config/nvim
          file: dotfiles/nvim/.config/nvim/tests/Dockerfile
          tags: nvim-config-test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run smoke tests
        run: docker run --rm -e CI nvim-config-test tests/run.sh

      - name: Run integration tests
        run: docker run --rm -e CI nvim-config-test tests/run.sh --integration
